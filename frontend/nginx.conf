server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 client_max_body_size 6m;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 location /api/ { proxy_pass http://backend:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
 location /swagger-ui { proxy_pass http://backend:8080; }
 location /v3/api-docs { proxy_pass http://backend:8080; }
 location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
 location / { try_files $uri $uri/ /index.html; }
}
