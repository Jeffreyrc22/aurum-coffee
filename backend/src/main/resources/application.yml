server:
  port: ${PORT:${APP_PORT:8080}}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_SECURE:false}
        same-site: lax
spring:
  datasource:
    hikari:
      maximum-pool-size: 4
      minimum-idle: 0
      idle-timeout: 60000
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/aurum}
    username: ${POSTGRES_USER:aurum}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  session:
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
app:
  uploads: ${UPLOAD_DIR:./uploads}
  admin-email: ${ADMIN_EMAIL:}
  admin-password: ${ADMIN_PASSWORD:}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
